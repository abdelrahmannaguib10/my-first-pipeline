name: Run Tests

on:
  push:
    branches: [ "main" ]

env:
  # This tells GitHub to ignore the Node 20 deprecation and use Node 24
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to match your environment force

      - name: Run TestSprite Tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        # Running all tests in project "test" using npx for reliability
        run: |
          npx testsprite run --project "test" --exit-code
