name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TestSprite AI
        env:
          TESTSPRITE_TOKEN: ${{ secrets.TESTSPRITE_TOKEN }}
        run: |
          # 1. Download the tool
          curl -fsSL https://get.testsprite.com/install.sh -o install.sh
          
          # 2. Give the computer permission to run the installer
          chmod +x install.sh
          
          # 3. Run the installer
          ./install.sh
          
          # 4. Run the test (using 'testsprite' directly if the installer adds it to PATH)
          testsprite run --file app.py --token $TESTSPRITE_TOKEN
