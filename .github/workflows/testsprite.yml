name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install TestSprite
        run: |
          pip install testsprite

      - name: Run AI Tests
        env:
          TESTSPRITE_TOKEN: ${{ secrets.TESTSPRITE_TOKEN }}
        run: |
          testsprite run ./app.py
