name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TestSprite AI
        env:
          # This pulls the secret you saved earlier
          TESTSPRITE_TOKEN: ${{ secrets.TESTSPRITE_TOKEN }}
        run: |
          # This command downloads and runs the TestSprite setup directly
          curl -fsSL https://get.testsprite.com/install.sh | bash
          ./testsprite run --file app.py --token $TESTSPRITE_TOKEN
