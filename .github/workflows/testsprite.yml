name: Run Tests

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TestSprite
        run: npm install -g testsprite

      - name: Run Specific TestSprite Tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        # Replace 'smoke' with the actual tag or suite name you want to run
        # Added --fail-fast or equivalent logic to ensure exit code is non-zero on failure
        run: |
          testsprite run --project "test" --tags "smoke" --exit-code
