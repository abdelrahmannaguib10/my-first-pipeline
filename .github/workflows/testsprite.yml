name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install TestSprite directly
        # If the standard name fails, we install directly from the source
        run: |
          python -m pip install --upgrade pip
          pip install testsprite-python-sdk

      - name: Run AI Tests
        env:
          TESTSPRITE_TOKEN: ${{ secrets.TESTSPRITE_TOKEN }}
        run: |
          # This runs the sdk we just installed
          testsprite-python run --file app.py --token $TESTSPRITE_TOKEN
