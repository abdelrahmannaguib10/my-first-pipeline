name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TestSprite via Docker
        # This tells GitHub to pull the "pre-made box" from Docker Hub
        uses: docker://testsprite/testsprite-cli:latest
        env:
          TESTSPRITE_TOKEN: ${{ secrets.TESTSPRITE_TOKEN }}
        with:
          # This passes the command directly to the tool inside the box
          args: run --file app.py
