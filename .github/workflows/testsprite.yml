name: TestSprite AI Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TestSprite
        # This is the step that triggers the AI agent
        uses: testsprite/testsprite-action@v1
        with:
          # You will get this API Key from your TestSprite dashboard
          token: ${{ secrets.TESTSPRITE_TOKEN }}
