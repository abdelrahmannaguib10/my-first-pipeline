name: Run Tests

on:
  push:
    branches: [ "main" ]

env:
  # This tells GitHub to allow actions to run on Node 24 even if they target Node 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run TestSprite Tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
        # We use npx to ensure the command is found and executed.
        # We removed --tags to make sure it finds any test in the project.
        run: |
          npx testsprite run --project "test" --exit-code
